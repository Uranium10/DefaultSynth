[package]
name = "defaultsynth"
description = "DefaultSynth - a CLAP and VST3 polyphonic synthesiser"
homepage = "https://github.com/defaultsynth/defaultsynth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Plugins are loaded as dynamic libraries by the host.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
ds-dsp = { path = "../ds-dsp", features = ["serde"] }
nih_plug = { workspace = true }
nih_plug_vizia = { workspace = true }

# The drawn LFO curve is plain Copy data, so an AtomicCell hands it to the audio
# thread without a mutex and without allocating.
crossbeam = "0.8"
serde = { version = "1", features = ["derive"] }
