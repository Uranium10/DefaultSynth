[package]
name = "defaultsynth"
description = "DefaultSynth - a CLAP and VST3 polyphonic synthesiser"
homepage = "https://github.com/defaultsynth/defaultsynth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Plugins are loaded as dynamic libraries by the host.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
ds-dsp = { path = "../ds-dsp" }
nih_plug = { workspace = true }
nih_plug_vizia = { workspace = true }
