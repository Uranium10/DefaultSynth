[package]
name = "ds-dsp"
description = "Host-agnostic synthesis core for DefaultSynth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Deliberately free of plugin-framework dependencies so the DSP can be unit-tested
# with a plain `cargo test` and reused outside a plugin host.
[dependencies]

# Only the drawn LFO curve needs to leave the process, and only so the host can
# save it with the session. The DSP itself never touches serde.
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
